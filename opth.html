<h1 align="center">
<tt>OPT-H</tt> </h1>
<p>
Turn on all optimization flags for hydrogen atoms.&nbsp; This keyword is useful
for partial geometry optimizations: first turn all 
<a href="Optimization_flags.html">optimization flags</a> off, then
use&nbsp; <tt>OPT-H</tt> to selectively turn on the optimization flags for
hydrogen atoms.&nbsp; See also <tt><a href="optc.html">OPT-C</a>,
<a href="optn.html">OPT-N</a>, <a href="opto.html">OPT-O</a>, and
<a href="opts.html">OPT-S</a>.</tt></p>
