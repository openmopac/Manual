<h1 align="center">
<tt>PRTXYZ</tt>
</h1>
        In the output, the Cartesian coordinates are not normally printed after 
the heat of formation is printed.&nbsp; To print the final Cartesian 
coordinates, add <tt>PRTXYZ</tt><p>See also <tt><a href="noxyz.html">NOXYZ</a></tt></p>
