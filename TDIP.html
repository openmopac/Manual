<tt>TDIP</tt>
</h1>
<p class="MsoNormal">Available for <a href="indo.html"><tt>INDO</tt></a>-based 
        CI calculations only. Print the transition dipole moments between 
        excited states to a file (extension .tdip). These transition dipole

        or nonlinear optical properties.</p>
